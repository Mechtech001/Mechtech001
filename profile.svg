<svg fill="none" viewBox="0 0 1200 2520" width="1200" height="2520" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap');

        @keyframes scan { 0%{transform:translateY(-80px);opacity:0} 10%{opacity:.12} 90%{opacity:.12} 100%{transform:translateY(720px);opacity:0} }
        @keyframes grad   { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        @keyframes fadeup { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        @keyframes blink  { 0%,49%{opacity:1} 50%,100%{opacity:0} }
        @keyframes pulseborder { 0%,100%{opacity:.5} 50%{opacity:1} }

        *{box-sizing:border-box;margin:0;padding:0}
        html,body{margin:0;padding:0}
        .page{width:1200px;background:#090B10;color:#F4F7FA;font-family:'JetBrains Mono',monospace;position:relative;overflow:hidden}

        /* ── HERO ── */
        .hero{position:relative;height:720px;padding:120px 72px 0;overflow:hidden;border-bottom:1px solid #1E2540}
        .hero-scan{position:absolute;left:0;right:0;top:0;height:80px;background:linear-gradient(transparent,#3D5EFF22,transparent);animation:scan 6s linear infinite}
        .hero-bg{position:absolute;right:-40px;top:60px;width:560px;height:560px;opacity:.18;filter:blur(2px)}
        .hero-ghost{position:absolute;left:40px;bottom:-60px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:240px;line-height:1;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1px #1E2540;white-space:nowrap;opacity:.55;pointer-events:none}
        .hero-tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#C1FF72;margin-bottom:24px;animation:fadeup .6s ease both}
        .hero-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:128px;line-height:.88;letter-spacing:-.045em;margin-bottom:28px;animation:fadeup .6s .05s ease both}
        .hero-name .at{color:#3D5EFF}
        .hero-tagline{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:500;line-height:1.35;color:#F4F7FA;max-width:760px;margin-bottom:22px;animation:fadeup .6s .1s ease both}
        .hero-rolepill{display:inline-block;margin-left:10px;padding:4px 12px;border:1px solid #C1FF72;color:#C1FF72;font-size:10px;letter-spacing:.12em;text-transform:uppercase;vertical-align:5px}
        .hero-about{font-size:13px;line-height:1.7;color:#8A94A6;max-width:680px;margin-bottom:40px;animation:fadeup .6s .15s ease both}
        .hero-stats{display:flex;gap:36px;animation:fadeup .6s .2s ease both}
        .hstat{display:flex;flex-direction:column;gap:6px}
        .hstat-v{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;line-height:1}
        .hstat-l{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#8A94A6}
        .hero-caret{display:inline-block;width:14px;height:28px;background:#C1FF72;margin-left:8px;vertical-align:-6px;animation:blink 1s step-end infinite}

        /* ── STACK ── */
        .stack{height:380px;padding:96px 72px;border-bottom:1px solid #1E2540;position:relative}
        .slabel{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#C1FF72;margin-bottom:24px}
        .stitle{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:80px;line-height:.9;letter-spacing:-.04em;margin-bottom:48px}
        .lrow{display:flex;align-items:center;gap:16px;margin-bottom:18px;animation:fadeup .5s ease both}
        .lname{font-size:12px;color:#8A94A6;width:150px;letter-spacing:.04em}
        .ltrack{flex:1;height:5px;background:#1E2540;border-radius:3px;overflow:hidden;max-width:680px}
        .lfill{height:100%;background:linear-gradient(90deg,#3D5EFF,#C1FF72);background-size:200% 100%;border-radius:3px;animation:grad 4s ease infinite,fadeup .6s ease both;transform-origin:left}
        .lpct{font-size:12px;color:#3D5EFF;width:44px;text-align:right}
        .lcount{font-size:11px;color:#8A94A6;width:90px;text-align:right}

        /* ── ARCHIVE ── */
        .archive{padding:96px 72px 64px;border-bottom:1px solid #1E2540;min-height:760px}
        .aheader{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:56px}
        .acards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        .repo{border:1px solid #1E2540;background:#0D1016;padding:28px;display:flex;flex-direction:column;gap:16px;text-decoration:none;animation:fadeup .6s ease both;position:relative;overflow:hidden}
        .repo::before{content:'';position:absolute;inset:0;background-image:linear-gradient(#1E254040 1px,transparent 1px),linear-gradient(90deg,#1E254040 1px,transparent 1px);background-size:24px 24px;opacity:.25;pointer-events:none}
        .repo-top{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8A94A6}
        .repo-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;letter-spacing:-.03em;color:#F4F7FA;text-decoration:none;word-break:break-word}
        .repo-desc{font-size:11px;line-height:1.6;color:#8A94A6;flex:1}
        .repo-stats{display:flex;gap:20px;font-size:11px;color:#8A94A6}
        .rs-star{color:#C1FF72}
        .rs-fork{color:#3D5EFF}

        /* ── FOOTER ── */
        .foot{padding:80px 72px;display:flex;align-items:center;justify-content:space-between;gap:24px}
        .foot-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em}
        .foot-brand .lime{color:#C1FF72}
        .foot-meta{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#1E2540}
        .foot-meta .accent{color:#3D5EFF}

        .badge-area{display:flex;gap:10px;flex-wrap:wrap;margin-top:36px}
        .fbadge{padding:6px 14px;border:1px solid #1E2540;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8A94A6;border-radius:2px}
        .fbadge.hi{border-color:#C1FF72;color:#C1FF72}
      </style>

      <div class="page">

        <!-- HERO -->
        <div class="hero">
          <div class="hero-scan"></div>
          <img src="https://avatars.githubusercontent.com/u/179168318?v=4" class="hero-bg" alt=""/>
          <div class="hero-ghost">ADITYA SHARMA</div>
          <p class="hero-tag">◈ SYNAPTIC CODE / IDENTITY RESOLVED</p>
          <h1 class="hero-name"><span class="at">@</span>Mechtech001<span class="hero-caret"></span></h1>
          <p class="hero-tagline">Building in public — JavaScript · TypeScript. Shipping open-source, one commit at a time.<span class="hero-rolepill">Student Developer · Open Source</span></p>
          <p class="hero-about">Pushing code, learning in the open, and contributing to projects that matter. Current focus: JavaScript · TypeScript. All metrics below update live from GitHub.</p>
          <div class="hero-stats">
            <div class="hstat"><span class="hstat-v">9</span><span class="hstat-l">Repositories</span></div>
            <div class="hstat"><span class="hstat-v">2</span><span class="hstat-l">Followers</span></div>
            <div class="hstat"><span class="hstat-v">8</span><span class="hstat-l">Following</span></div>
            <div class="hstat"><span class="hstat-v">0</span><span class="hstat-l">Total Stars</span></div>
          </div>
        </div>

        <!-- STACK -->
        <div class="stack">
          <p class="slabel">02 / Language topology</p>
          <h2 class="stitle">STACK.</h2>
          
      <div class="lrow">
        <span class="lname">JavaScript</span>
        <div class="ltrack"><div class="lfill" style="width:88%;animation-delay:0s"></div></div>
        <span class="lpct">88%</span>
        <span class="lcount">7</span>
      </div>
      <div class="lrow">
        <span class="lname">TypeScript</span>
        <div class="ltrack"><div class="lfill" style="width:13%;animation-delay:0.08s"></div></div>
        <span class="lpct">13%</span>
        <span class="lcount">1</span>
      </div>
        </div>

        <!-- ARCHIVE -->
        <div class="archive">
          <div class="aheader">
            <div>
              <p class="slabel">03 / Repository archive</p>
              <h2 class="stitle">PROOF OF<br/>WORK.</h2>
            </div>
          </div>
          <div class="acards">
            
      <div class="repo" style="animation-delay:0.1s">
        <div class="repo-top">
          <span class="repo-lang">JavaScript</span>
          <span class="repo-year">2026</span>
        </div>
        <a href="https://github.com/Mechtech001/Car_Vista" class="repo-name">Car_Vista</a>
        <p class="repo-desc">Open-source project documented through its code and commit history.</p>
        <div class="repo-stats">
          <span class="rs-star">★ 0</span>
          <span class="rs-fork">⑂ 0</span>
        </div>
      </div>
      <div class="repo" style="animation-delay:0.2s">
        <div class="repo-top">
          <span class="repo-lang">JavaScript</span>
          <span class="repo-year">2026</span>
        </div>
        <a href="https://github.com/Mechtech001/DevTinder" class="repo-name">DevTinder</a>
        <p class="repo-desc">Open-source project documented through its code and commit history.</p>
        <div class="repo-stats">
          <span class="rs-star">★ 0</span>
          <span class="rs-fork">⑂ 0</span>
        </div>
      </div>
      <div class="repo" style="animation-delay:0.30000000000000004s">
        <div class="repo-top">
          <span class="repo-lang">Unclassified</span>
          <span class="repo-year">2026</span>
        </div>
        <a href="https://github.com/Mechtech001/Mechtech001" class="repo-name">Mechtech001</a>
        <p class="repo-desc">Open-source project documented through its code and commit history.</p>
        <div class="repo-stats">
          <span class="rs-star">★ 0</span>
          <span class="rs-fork">⑂ 0</span>
        </div>
      </div>
      <div class="repo" style="animation-delay:0.4s">
        <div class="repo-top">
          <span class="repo-lang">JavaScript</span>
          <span class="repo-year">2026</span>
        </div>
        <a href="https://github.com/Mechtech001/Ledger" class="repo-name">Ledger</a>
        <p class="repo-desc">Financial transaction system and secure backend processing transactions across 8 database models with JWT auth and RBAC </p>
        <div class="repo-stats">
          <span class="rs-star">★ 0</span>
          <span class="rs-fork">⑂ 0</span>
        </div>
      </div>
          </div>
        </div>

        <!-- FOOTER -->
        <div class="foot">
          <div>
            <p class="foot-brand">SYNAPTIC <span class="lime">CODE</span> / MECHTECH001</p>
            <div class="badge-area">
              <span class="fbadge hi">open source</span>
              <span class="fbadge">student dev</span>
              <span class="fbadge">always shipping</span>
            </div>
          </div>
          <p class="foot-meta"><span class="accent">⚡</span> synapticcode.dev</p>
        </div>

      </div>
    </div>
  </foreignObject>
</svg>

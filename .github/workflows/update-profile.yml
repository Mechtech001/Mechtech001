name: Update profile

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours
  workflow_dispatch:            # lets you run it by hand from the Actions tab
  push:
    paths:
      - scripts/update_profile.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh stats and graph
        run: python3 scripts/update_profile.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/*.svg
          git diff --cached --quiet || (git commit -m "chore: refresh profile stats" && git push)
